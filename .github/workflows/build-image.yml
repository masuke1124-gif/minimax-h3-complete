name: Build MiniMax H3 image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - custom_nodes/**
      - scripts/**
      - workflows/**
      - tests/**
      - .github/workflows/build-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/minimax-h3-complete:latest
            ghcr.io/${{ github.repository_owner }}/minimax-h3-complete:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

